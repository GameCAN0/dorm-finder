<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ฟอร์มรีวิวหอพัก ให้คะแนนความสะอาด ความปลอดภัย และอ่านรีวิวล่าสุด">
  <title>รีวิวหอพัก - Dorm Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="review">
  <a href="#main-content" class="skip-link">ข้ามไปเนื้อหาหลัก</a>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand-title">
        <span>🏠 Dorm Finder</span>
      </a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="dorms.html">ค้นหาหอพัก</a></li>
          <li><a href="compare.html">เปรียบเทียบ <span id="compare-badge" class="badge">0</span></a></li>
          <li><a href="review.html" class="active" aria-current="page">รีวิวหอพัก</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <h1>รีวิวและให้คะแนนหอพัก</h1>

    <div class="dorm-detail-grid">
      <!-- Form Section -->
      <section class="form-panel" aria-labelledby="write-review-heading">
        <h2 id="write-review-heading">เขียนรีวิวหอพัก</h2>
        <div id="form-error" style="color:var(--danger); font-weight:bold; margin-bottom:0.5rem;" aria-live="polite"></div>
        
        <form id="review-form" novalidate>
          <div class="form-group">
            <label for="review-dorm">เลือกหอพัก:</label>
            <select id="review-dorm" class="form-control" required>
              <option value="">กำลังโหลดรายการหอพัก...</option>
            </select>
          </div>

          <div class="form-group">
            <fieldset style="border:none; padding:0; margin:0;">
              <legend style="font-weight:600; font-size:0.95rem; margin-bottom:0.35rem;">ให้คะแนนภาพรวม (1-5 ดาว):</legend>
              <div style="display:flex; gap:1rem;">
                <label><input type="radio" name="rating" value="1" required> 1 ⭐</label>
                <label><input type="radio" name="rating" value="2"> 2 ⭐</label>
                <label><input type="radio" name="rating" value="3"> 3 ⭐</label>
                <label><input type="radio" name="rating" value="4"> 4 ⭐</label>
                <label><input type="radio" name="rating" value="5" checked> 5 ⭐</label>
              </div>
            </fieldset>
          </div>

          <div class="form-group">
            <label for="cleanliness">ระดับความสะอาด:</label>
            <select id="cleanliness" class="form-control" required>
              <option value="ดีมาก">ดีมาก</option>
              <option value="ดี" selected>ดี</option>
              <option value="ปานกลาง">ปานกลาง</option>
              <option value="ควรปรับปรุง">ควรปรับปรุง</option>
            </select>
          </div>

          <div class="form-group">
            <label for="safety">ระดับความปลอดภัย:</label>
            <select id="safety" class="form-control" required>
              <option value="ดีมาก">ดีมาก</option>
              <option value="ดี" selected>ดี</option>
              <option value="ปานกลาง">ปานกลาง</option>
              <option value="ควรปรับปรุง">ควรปรับปรุง</option>
            </select>
          </div>

          <div class="form-group">
            <label for="author">ชื่อผู้รีวิว / นามแฝง:</label>
            <input type="text" id="author" class="form-control" placeholder="เช่น นักศึกษาปี 2" required />
          </div>

          <div class="form-group">
            <label for="comment">ความคิดเห็น / ข้อเสนอแนะ:</label>
            <textarea id="comment" class="form-control" rows="4" placeholder="แบ่งปันประสบการณ์การอยู่อาศัยที่หอนี้ (อย่างน้อย 10 ตัวอักษร)..." required minlength="10"></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;">ส่งรีวิว</button>
        </form>
      </section>

      <!-- Review List Section -->
      <section aria-labelledby="reviews-list-heading">
        <h2 id="reviews-list-heading">รีวิวล่าสุดจากนักศึกษา</h2>
        <div id="reviews-list">
          <!-- Rendered via JS -->
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Dorm Finder - กลุ่มที่ 7 (กลุ่มหมูเด้ง) รายวิชา SC17332 Mini Project Smart Campus</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
